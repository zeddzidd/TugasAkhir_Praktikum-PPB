<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian to Emerald Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071b16" />
      <stop offset="100%" stop-color="#02140e" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffb2" />
      <stop offset="100%" stop-color="#00a876" />
    </linearGradient>

    <!-- Text Metallic Silver/White Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Radial Emerald Ambient Light -->
    <radialGradient id="radialGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00dfa2" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#00dfa2" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#00dfa2" stop-opacity="0" />
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="monogramShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00dfa2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Radial Light Ambient Glow -->
  <rect width="512" height="512" rx="112" fill="url(#radialGlow)" />
  
  <!-- Subtle Emerald Inner Border Ring -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="110" stroke="url(#emeraldGrad)" stroke-width="3" stroke-opacity="0.4" fill="none" />

  <!-- Monogram "ZC" -->
  <g filter="url(#monogramShadow)">
    <text x="256" y="318" 
          text-anchor="middle" 
          font-family="'Impact', 'Segoe UI Black', 'Arial Black', -apple-system, sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="196" 
          fill="url(#textGrad)" 
          letter-spacing="2">ZC</text>
  </g>

  <!-- Emerald Dynamic Accent Bar -->
  <rect x="166" y="358" width="180" height="7" rx="3.5" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)" />

  <!-- Subtitle "ZEDCONSIGN" -->
  <text x="256" y="405" 
        text-anchor="middle" 
        font-family="'Inter', 'Segoe UI', -apple-system, Arial, sans-serif" 
        font-weight="800" 
        font-size="19" 
        fill="#94a3b8" 
        letter-spacing="8">ZEDCONSIGN</text>
</svg>
