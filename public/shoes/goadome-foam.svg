<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="#f4f5f7"/>
  <!-- Outsole with rugged lugs and visible Air bubble -->
  <path d="M38 185 C75 190, 240 190, 345 182 C358 180, 362 172, 356 166 C335 164, 110 164, 46 168 C36 170, 32 180, 38 185 Z" fill="#171717"/>
  <!-- Rugged outsole cleats -->
  <rect x="70" y="185" width="16" height="5" rx="2" fill="#171717"/>
  <rect x="110" y="185" width="16" height="5" rx="2" fill="#171717"/>
  <rect x="150" y="185" width="16" height="5" rx="2" fill="#171717"/>
  <rect x="190" y="185" width="16" height="5" rx="2" fill="#171717"/>
  <rect x="230" y="184" width="16" height="5" rx="2" fill="#171717"/>
  <rect x="270" y="182" width="16" height="5" rx="2" fill="#171717"/>
  
  <!-- Midsole Black -->
  <path d="M46 168 C110 164, 335 164, 356 166 C360 156, 350 148, 330 148 C250 148, 90 148, 52 152 C42 153, 42 163, 46 168 Z" fill="#262626"/>
  <!-- Visible Air Windows -->
  <rect x="90" y="156" width="22" height="8" rx="4" fill="#e5e5e5" stroke="#171717" stroke-width="1.5"/>
  <rect x="120" y="156" width="20" height="8" rx="4" fill="#e5e5e5" stroke="#171717" stroke-width="1.5"/>
  <line x1="101" y1="156" x2="101" y2="164" stroke="#737373" stroke-width="2"/>
  <line x1="130" y1="156" x2="130" y2="164" stroke="#737373" stroke-width="2"/>

  <!-- Upper Foam Form - Green Goblin Metallic Olive Gradient -->
  <defs>
    <linearGradient id="goblinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5d3f"/>
      <stop offset="40%" stop-color="#647b53"/>
      <stop offset="70%" stop-color="#3d4e33"/>
      <stop offset="100%" stop-color="#24301f"/>
    </linearGradient>
    <linearGradient id="foamWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#738d61" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#36452d" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Foam Molded Upper -->
  <path d="M52 152 C48 120, 68 85, 110 80 C130 78, 150 90, 160 105 C175 120, 205 130, 255 136 C295 140, 335 145, 342 148 C330 138, 305 132, 270 130 C220 128, 175 110, 152 90 C138 78, 120 75, 102 76 C65 80, 48 115, 52 152 Z" fill="url(#goblinGrad)"/>

  <!-- Molded Foam Grooves & Waves (Goadome Foam Signature) -->
  <path d="M100 85 C120 100, 170 125, 230 135" stroke="url(#foamWave)" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 98 C115 112, 165 133, 240 140" stroke="url(#foamWave)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M80 112 C105 125, 160 142, 250 144" stroke="url(#foamWave)" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 128 C100 138, 150 149, 230 148" stroke="url(#foamWave)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Collar / Tongue / Heel Pull Tab -->
  <path d="M82 82 C80 65, 92 60, 105 62 C115 64, 118 75, 110 82 Z" fill="#171717"/>
  <!-- Heel pull loop -->
  <path d="M56 100 C45 92, 48 80, 58 84" stroke="#171717" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Minimalist swoosh near heel -->
  <path d="M88 100 C98 100, 115 104, 125 98 C126 100, 120 104, 110 106 C100 108, 90 106, 88 100 Z" fill="#171717"/>

  <!-- Subtitle Tag in Corner -->
  <text x="360" y="35" fill="#a3a3a3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="end">AIR MAX GOADOME</text>
</svg>